<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1F23"/>
      <stop offset="100%" stop-color="#0E0E11"/>
    </linearGradient>
    <linearGradient id="wl" x1="4" y1="4" x2="12" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E4E7"/>
    </linearGradient>
    <linearGradient id="wr" x1="12" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4D4D8"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>
    <linearGradient id="core" x1="12" y1="6" x2="12" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  
  <!-- Polished Squircle Background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  
  <!-- Icon Mark with -12deg rotation -->
  <g transform="translate(16, 16) rotate(-12) translate(-12, -12)">
    <!-- Left Wing -->
    <path d="M12 2.5L3.5 19.5L12 15.5V2.5Z" fill="url(#wl)"/>
    <!-- Right Wing -->
    <path d="M12 2.5L20.5 19.5L12 15.5V2.5Z" fill="url(#wr)"/>
    <!-- Center Crease -->
    <path d="M12 2.5V15.5" stroke="#FFFFFF" stroke-width="0.75" stroke-linecap="round" opacity="0.8"/>
    <!-- Navigation Core -->
    <path d="M12 6.5L15.2 13.8L12 12.2L8.8 13.8L12 6.5Z" fill="url(#core)"/>
    <!-- Jet Point -->
    <circle cx="12" cy="18.2" r="0.9" fill="#60A5FA" opacity="0.9"/>
  </g>
</svg>
